spring.application.name=carrinho
server.port=${PORT:8002}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=${DB_SSLMODE:require}&currentSchema=carrinho&prepareThreshold=0
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=3

spring.jpa.properties.hibernate.default_schema=carrinho
spring.jpa.hibernate.ddl-auto=update