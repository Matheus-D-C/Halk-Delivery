spring.application.name=pedido
server.port=${PORT:8004}

# Conexão com o Supabase (Session Pooler na porta 5432)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=${DB_SSLMODE:require}&currentSchema=pedido&prepareThreshold=0
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=3

# Isolamento de schema e criação automática das tabelas
spring.jpa.properties.hibernate.default_schema=pedido
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# URL do microsserviço de Carrinho
carrinho.url=${CARRINHO_URL:http://localhost:8002}